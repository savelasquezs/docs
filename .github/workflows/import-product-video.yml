name: Import product documentation video

on:
  push:
    branches:
      - admin-mcp/documentar-productos-45732d1

permissions:
  contents: write

jobs:
  import-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download generated video artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-19ec-81f6-9044-e647be7f1de4/raw?se=2026-10-08T00%3A48%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=9afc01ee-8bf4-5251-8b4f-67a1790aea0a&skoid=c36a4874-d531-4a8d-99fc-7da0d9143d9c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T23%3A56%3A39Z&ske=2026-10-08T23%3A56%3A39Z&sks=b&skv=2026-02-06&sig=VV9unSK0cGIulV8EGLVzH4/tlC14NhDAZwLMtOI8/2E%3D' -o /tmp/video-v4.zip
          mkdir -p media
          unzip -jo /tmp/video-v4.zip 'final/mip-gestion-productos-v4.mp4' -d media
          test -s media/mip-gestion-productos-v4.mp4

      - name: Commit published video and remove importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f media/mip-gestion-productos-v4.mp4
          git rm .github/workflows/import-product-video.yml
          git commit -m "docs: publish product management video [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
